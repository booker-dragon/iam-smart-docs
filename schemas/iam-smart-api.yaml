webhooks:
  auth-code-callback:
    get:
      operationId: auth-code-callback
      summary: Callback with authCode to Online Service Server
      description: |-
        The user's browser is redirected to your registered `redirectURI` after they approve (or deny) in the iAM Smart app. Exchange `code` with [Request accessToken & Tokenised ID](/api/operations/request-access-token/) within 60 seconds (1 minute in anonymous workflows), and verify `state`.

        Treat the request as failed if no callback arrives within **18 minutes** (login) or **12 minutes** (anonymous workflows).

        For the same-device **app** flow, the same parameters are delivered to your app via Universal Link / App Link (appv1) or an Android intent extra (appv2) — see [App deep links](/reference/deep-links/).

        _Source: iAM Smart API Specification v2.5.2, section 3.4.3, 3.4.4, 5.5.4, 5.5.5._
      tags:
      - Callbacks
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
        description: Authorisation code (single use). Present on success.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: The `state` you sent.
      - name: businessID
        in: query
        required: false
        schema:
          type: string
        description: 'Only in anonymous workflows: the `businessID` of the original request.'
      - name: error_code
        in: query
        required: false
        schema:
          type: string
        description: Present instead of `code` when an error occurred, e.g. `D20001`.
  direct-login-v2-callback:
    get:
      operationId: direct-login-v2-callback
      summary: Callback with authCode (Direct Login v2)
      description: |-
        Direct Login v2 starts from the iAM Smart app's service catalogue. You must register a **separate** callback endpoint (one per language: en / tc / sc) and fallback URLs in the ESP. The code expires in **30 seconds**; exchange it with `isDirectLoginV2: "true"`. On error, the user is sent to your fallback URL with `error_code` (e.g. `D20008`). Requested scopes outside the approved list return `D20012`.

        **Direct Login v2 (App):** your app receives `code` and a PKCE `code_verifier` via Universal Link (iOS) or intent extras (Android); send both to *Request accessToken*.

        _Source: iAM Smart API Specification v2.5.2, section 3.4.6, 3.4.9._
      tags:
      - Callbacks
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
        description: Authorisation code, expires in 30 seconds.
      - name: RefID
        in: query
        required: false
        schema:
          type: string
        description: Unique value for troubleshooting.
      - name: error_code
        in: query
        required: false
        schema:
          type: string
        description: Sent to your fallback URL when an error occurred.
  form-filling-callback:
    post:
      operationId: form-filling-callback
      summary: Callback to Receive Form Filling Information (JSON)
      description: |-
        Delivers the consented form filling data when `callbackContentType` is omitted or `application/json`.

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 4.2.5.3.1._
      tags:
      - Form Filling
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    allOf:
                    - type: object
                      properties:
                        businessID:
                          $ref: '#/components/schemas/BusinessID'
                        state:
                          $ref: '#/components/schemas/State'
                      required:
                      - businessID
                    - $ref: '#/components/schemas/ProfileData'
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 2YotnFZFEjr1zCsicMWpAA
                idNo:
                  Identification: A123456
                  CheckDigit: A
                prefix: Mr
                enName:
                  UnstructuredName: SAN, Chi Nan
                chName:
                  ChineseName: 申智能
                chNameVerified: 申智能
                birthDate: '19960128'
                gender: M
                maritalStatus: S
                mobileNumber:
                  CountryCode: '1'
                  SubscriberNumber: '98765432'
                emailAddress: scn@digitalpolicy.gov.hk
                residentialAddress:
                  FreeFormatAddress:
                    LanguageCode: en
                    AddressLine1: Unit 2000, 200/F
                    AddressLine2: 5033 Yitian Road, Futian CBD
                    AddressLine3: Futian district, Shenzhen
                postalAddress:
                  PostBoxAddress:
                    EngPostBox:
                      PoBoxNo: 24700
                      PostOffice: ABERDEEN POST OFFICE
                      PostOfficeRegion: HONG KONG
                educationLevel: T
                addressDocInfo:
                  enProviderName: HK Electric
                  tcProviderName: 港燈
                  scProviderName: 港灯
                  enUserName: SAN, Chi Nan
                  tcUserName: 申智能
                  enServiceAddress:
                    addressLine1: 19/F, 213 Queen's Road East
                    addressLine2: Wanchai, Hong Kong
                  lastRetrievalDate: 1560853718006
  form-filling-callback-multipart:
    post:
      operationId: form-filling-callback-multipart
      summary: Callback to Receive Form Filling Information (multipart)
      description: |-
        Delivers form filling data when `callbackContentType` is `multipart/form-data`: part `docFile` is the (encrypted) PDF e-bill binary, part `profile` is the JSON envelope. Both are encrypted with the same CEK; `addressDocFile` then only contains `docHash` and `billDate`.

        _Source: iAM Smart API Specification v2.5.2, section 4.2.5.3.2._
      tags:
      - Form Filling
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                docFile:
                  type: string
                  contentMediaType: application/pdf
                  description: Encrypted PDF e-bill binary (filename `docfile.pdf`).
                profile:
                  allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      content:
                        allOf:
                        - type: object
                          properties:
                            businessID:
                              $ref: '#/components/schemas/BusinessID'
                            state:
                              $ref: '#/components/schemas/State'
                          required:
                          - businessID
                        - $ref: '#/components/schemas/ProfileData'
                  description: JSON part (`application/json;charset=UTF-8`).
  signing-result-callback:
    post:
      operationId: signing-result-callback
      summary: Callback to Receive Digital Signing Result
      description: |-
        Delivers the hash signing result. Treat the request as failed if it does not arrive within **18 minutes**. Then [acknowledge it](/api/operations/acknowledge-signing-result/).

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 6.5.4._
      tags:
      - Digital Signing
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    allOf:
                    - type: object
                      properties:
                        businessID:
                          $ref: '#/components/schemas/BusinessID'
                        state:
                          $ref: '#/components/schemas/State'
                      required:
                      - businessID
                    - $ref: '#/components/schemas/HashSigningResult'
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 2YotnFZFEjr1zCsicMWpAA
                state: unesidkd
                hashCode: tGzv3JOkF0XG5Qx2TlKWIA
                timestamp: 1556450176000
                signature: nnoadisauflanefhykdjf
                cert: sdfGSDGsdfaGDEHfjslgGQG……GSGjljlkjwmh
  pdf-signing-result-callback:
    post:
      operationId: pdf-signing-result-callback
      summary: Callback to Receive PDF Digital Signing Result
      description: |-
        Delivers the PDF signing result (a PKCS#7 signature to embed in the PDF). Treat as failed after **18 minutes**. Then [acknowledge it](/api/operations/acknowledge-signing-result/).

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 6.5.5._
      tags:
      - Digital Signing
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    allOf:
                    - type: object
                      properties:
                        businessID:
                          $ref: '#/components/schemas/BusinessID'
                        state:
                          $ref: '#/components/schemas/State'
                      required:
                      - businessID
                    - $ref: '#/components/schemas/PdfSigningResult'
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 2YotnFZFEjr1zCsicMWpAA
                state: unesidkd
                docDigest: tGzv3JOkF0XG5Qx2TlKWIA
                pdfSignature: sdfGSDGsdfaGDEHfjslgGQG……GSGjljlkjwmh
  re-authentication-result-callback:
    post:
      operationId: re-authentication-result-callback
      summary: Callback to Receive Re-authentication Result
      description: |-
        Delivers the re-authentication result. Treat as failed after **18 minutes**.

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 8.5.3._
      tags:
      - Re-authentication
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    type: object
                    properties:
                      businessID:
                        $ref: '#/components/schemas/BusinessID'
                      state:
                        $ref: '#/components/schemas/State'
                      isPassed:
                        type: boolean
                        description: '`true` if the same person re-authenticated. (Typed as String in the spec''s table; the example shows a boolean.)'
                    required:
                    - businessID
                    - isPassed
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 3e47be25-66a6-43fb-89f6-7e2dd138aff8
                state: unesidkd
                isPassed: true
  bsqc-token-callback:
    post:
      operationId: bsqc-token-callback
      summary: Callback to Receive BSQC Token
      description: |-
        Delivers the BSQC token for a bulk signing request (service-login flow). Treat the request as failed if it does not arrive within **18 minutes**. The token is valid for 1 day.

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 9.5.3._
      tags:
      - Bulk Digital Signing
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    type: object
                    properties:
                      businessID:
                        $ref: '#/components/schemas/BusinessID'
                      state:
                        $ref: '#/components/schemas/State'
                      BSQCToken:
                        $ref: '#/components/schemas/BSQCToken'
                    required:
                    - businessID
                    - BSQCToken
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 2YotnFZFEjr1zCsicMWpAA
                state: unesidkd
                BSQCToken: nnoadisauflanefhykdjf…f83h96e
  bulk-signing-result-callback:
    post:
      operationId: bulk-signing-result-callback
      summary: Callback to Receive Bulk Digital Signing Result
      description: |-
        Delivered as `multipart/form-data` to `callbackResultURI`, possibly split over several callbacks (`totalCallbacks`, `callbackSeq`). Part `sigFile` holds the signatures; part `sigMetada` (sic) holds the metadata. Both parts are encrypted with the same CEK. On failure only `sigMetada` is sent. Treat as failed if nothing arrives within **1 day**, and always [acknowledge](/api/operations/acknowledge-bulk-signing-result/).

        _Source: iAM Smart API Specification v2.5.2, section 9.5.4, 10.5.7._
      tags:
      - Bulk Digital Signing
      - Anonymous Bulk Digital Signing
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                sigFile:
                  type: object
                  description: 'Text file (`signatures.txt`) containing `{"signatures": [...]}`.'
                  properties:
                    signatures:
                      type: array
                      items:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              maxLength: 36
                            hash:
                              type: string
                              description: Submitted document hash.
                            timestamp:
                              type: integer
                              format: int64
                            signature:
                              type: string
                              description: Base64 signature (on success).
                          required:
                          - id
                          - hash
                          title: Hash signature
                        - type: object
                          properties:
                            id:
                              type: string
                              maxLength: 36
                            docDigest:
                              type: string
                            pdfSignature:
                              type: string
                              description: Base64 PKCS#7 signature (on success).
                          required:
                          - id
                          - docDigest
                          title: PDF signature
                sigMetada:
                  allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      content:
                        type: object
                        properties:
                          businessID:
                            $ref: '#/components/schemas/BusinessID'
                          state:
                            $ref: '#/components/schemas/State'
                          cert:
                            type: string
                            description: Base64 DER certificate of the user (on success).
                          totalCallbacks:
                            type: integer
                            default: 1
                            description: 'Number of callbacks: `int((n-1)/m + 1)` for n documents and `maxCallbackSigs` m.'
                          callbackSeq:
                            type: integer
                            default: 1
                            description: 1 … totalCallbacks.
                          totalSignNum:
                            type: integer
                            description: Number of documents signed.
                          failSignNum:
                            type: integer
                            description: Number of documents that failed.
                        required:
                        - businessID
                  description: JSON part with the metadata (part name is spelled `sigMetada` in the spec).
  step-up-authentication-result-callback:
    post:
      operationId: step-up-authentication-result-callback
      summary: Callback to Receive Step-up Authentication Result
      description: |-
        Delivers the step-up authentication result. Treat as failed after **18 minutes**.

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 11.5.3._
      tags:
      - Step-up Authentication
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    type: object
                    properties:
                      businessID:
                        $ref: '#/components/schemas/BusinessID'
                      state:
                        $ref: '#/components/schemas/State'
                      isPassed:
                        type: boolean
                        description: '`true` if the same person passed.'
                    required:
                    - businessID
                    - isPassed
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 3e47be25-66a6-43fb-89f6-7e2dd138aff8
                state: unesidkd
                isPassed: true
  cdeg-consent-result-callback:
    post:
      operationId: cdeg-consent-result-callback
      summary: Callback With CDEG Consent Result
      description: |-
        Delivers the user's consent decision for a CDEG data provider. Treat as failed after **18 minutes**.

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 13.5.4._
      tags:
      - CDEG Integration
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    type: object
                    properties:
                      businessID:
                        $ref: '#/components/schemas/BusinessID'
                      state:
                        $ref: '#/components/schemas/State'
                      consentResult:
                        type: boolean
                        description: '`true` if the user has consented to "All Government B/Ds" or to this provider.'
                    required:
                    - businessID
                    - consentResult
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 3e47be25-66a6-43fb-89f6-7e2dd138aff8
                state: unesidkd
                consentResult: true
  profile-callback-v1:
    post:
      operationId: profile-callback-v1
      summary: Callback to Receive iAM Smart Profile (v1)
      description: |-
        **Shut down on 31 December 2025** together with Request Profile (v1).

        The body is shown **decrypted**. On the wire, `content` is an AES-256-GCM ciphertext (Base64) and `secretKey` carries the CEK encrypted with your KEK; see [Callbacks](/security/callbacks/). Reply with HTTP 200.

        _Source: iAM Smart API Specification v2.5.2, section 3.5.1.3._
      tags:
      - Deprecated APIs
      responses:
        '200':
          description: Acknowledge receipt with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  secretKey:
                    $ref: '#/components/schemas/CallbackSecretKey'
                  content:
                    allOf:
                    - type: object
                      properties:
                        businessID:
                          $ref: '#/components/schemas/BusinessID'
                        state:
                          $ref: '#/components/schemas/State'
                      required:
                      - businessID
                    - $ref: '#/components/schemas/ProfileData'
            example:
              txID: <T=938ffb193b4b4370b6c2584372c6a588>
              code: D00000
              message: SUCCESS
              content:
                businessID: 3e47be25-66a6-43fb-89f6-7e2dd138aff8
                state: unesidkd
                idNo:
                  Identification: A123456
                  CheckDigit: A
                enName:
                  UnstructuredName: SAN, Chi Nan
                gender: M
      deprecated: true
components:
  parameters:
    clientID:
      name: clientID
      in: header
      required: true
      schema:
        type: string
      description: Client identifier assigned at registration.
      example: edae2e2529ff46228af1e4d18c8405d1
    signatureMethod:
      name: signatureMethod
      in: header
      required: true
      schema:
        type: string
        const: HmacSHA256
      description: Signature algorithm. Always `HmacSHA256`.
    timestamp:
      name: timestamp
      in: header
      required: true
      schema:
        type: integer
        format: int64
      description: Request time in epoch milliseconds. Must be ≥ the timestamp of your previous request (replay protection).
      example: 1557048906183
    nonce:
      name: nonce
      in: header
      required: true
      schema:
        type: string
        maxLength: 36
      description: Random string unique per request, at most 36 ASCII characters (replay protection).
      example: e893647dc4204eb9b7b8eddd527b687c
    signature:
      name: signature
      in: header
      required: true
      schema:
        type: string
      description: Base64(HMAC-SHA256(clientSecret, clientID + signatureMethod + timestamp + nonce + encryptedRequestBody)), URL encoded. See [Request signing](/security/signing/).
      example: 5X42Y1B7MEd8Mm%2BonwjiQz9VCZkkrntADskXsYntavU%3D
    rateLimitFactor:
      name: rateLimitFactor
      in: header
      required: false
      schema:
        type: string
        contentEncoding: base64
      description: '**Required for step-up authentication and for signing requests that use `suaMethod`.** Base64 of a JSON object such as `{"key":"suaMethod","value":["FR","NFC"]}`.'
      example: eyJrZXkiOiJzdWFNZXRob2QiLCJ2YWx1ZSI6WyJGUiIsIk5GQyJdfQ==
  responses:
    HttpError:
      description: 'Transport-level error: 400 malformed request · 401 missing credentials · 403 forbidden · 404 not found · 413 upload > 5 MB or request > 10 MB · 429 too many requests · 500 server error · 503 unavailable or maintenance. See [HTTP status codes](/reference/response-format/#http-status-codes).'
  schemas:
    BusinessID:
      type: string
      maxLength: 36
      description: Unique identifier chosen by the online service to tell requests apart and match callbacks to requests. ASCII, at most 36 characters.
      examples:
      - bbb8aae57c104cda40c93843ad5e6db8
    AccessToken:
      type: string
      description: '`accessToken` from [Request accessToken & Tokenised ID](/api/operations/request-access-token/).'
      examples:
      - xxxa42e76bf4cb0846a68e6d83d6096
    OpenID:
      type: string
      maxLength: 64
      description: Tokenised ID (`openID`) of the user, unique per user per online service.
      examples:
      - liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
    Source:
      type: string
      enum:
      - Android_Chrome
      - Android_Firefox
      - Android_Edge
      - Android_Samsung
      - Android_Huawei
      - Android_Xiaomi
      - Android_IMS_InAppBrowser
      - iOS_Safari
      - iOS_Chrome
      - iOS_Firefox
      - iOS_Edge
      - iOS_IMS_InAppBrowser
      - PC_Browser
      - App_Link
      - App_Package
      - App_Scheme
      description: 'Request initiator: the browser or app calling method. See [Source values](/reference/source-values/).'
      examples:
      - Android_Chrome
    AppV2Source:
      type: string
      enum:
      - App_Link
      - App_Package
      description: '`App_Link` (iOS, Universal Link) or `App_Package` (Android, package name + activity).'
      examples:
      - App_Package
    State:
      type: string
      maxLength: 36
      pattern: ^[A-Za-z0-9_-]{1,36}$
      description: Anti-CSRF value defined by the online service. If present, the same value is returned in the callback. Secure random string, at most 36 characters (UUID length); only ASCII letters, numbers, underscore and hyphen are accepted.
      examples:
      - eddd527b6
    RedirectURI:
      type: string
      format: uri
      description: Callback URI. Must be registered in the Self-Service Portal (ESP).
      examples:
      - https://rp_domain/rp_context/call_back_endpoint
    ServerRedirectURI:
      type: string
      format: uri
      description: Server callback URI that receives the result. Must be registered in the ESP.
      examples:
      - https://rp_domain/rp_context/call_back_endpoint
    ClientRedirectURI:
      type: string
      description: '**iOS only, required on iOS.** Universal Link the iAM Smart app returns to. URL encoded and registered in the ESP. Encoded and unencoded commas are not accepted.'
    PackageName:
      type: string
      description: '**Android only, required on Android.** Package name of the online service app used for the callback. Must be registered in the ESP.'
      examples:
      - com.onlineservice.myapp
    ActivityClass:
      type: string
      description: '**Android only, required on Android.** Activity class name of the online service app used for the callback.'
      examples:
      - callback_activity
    ActivityParams:
      type: string
      description: '**Android only, optional.** Extra parameters passed back during the callback.'
      examples:
      - callback_param
    HKICHash:
      type: string
      description: SHA-256 hash of the user's HKIC number, Base64 encoded. Hash only the identifier without the check digit, e.g. `A123456`. The request is only processed when the signing user's HKIC hash matches.
      examples:
      - 6ea37e641260714009a880a8057032a414009a80f667efc
    SuaMethod:
      type: string
      contentMediaType: application/json
      description: 'Step-up authentication method as a JSON string. One of `{"unary": ["FR"]}`, `{"unary": ["NFC"]}` or `{"and": ["FR", "NFC"]}`. The method(s) must have been granted to the online service in the e-Service Management Portal. The request fails immediately if the first method fails.'
      examples:
      - '{"unary": ["FR"]}'
    SuaWaitPeriod:
      type: integer
      minimum: 0
      maximum: 720
      default: 0
      description: Minimum number of hours since the user account was created. The greater of this value and the system-defined waiting period applies. System default is 0. Maximum 720.
      examples:
      - 10
    SuaMessage:
      type: string
      maxLength: 10
      description: Code of a registered service message shown in the iAM Smart app before step-up authentication. ASCII, at most 10 characters. Only applies when `suaMethod` is set.
      examples:
      - '0001'
    SigAlgo:
      type: string
      enum:
      - SHA256withRSA
      - NONEwithRSA
      default: SHA256withRSA
      description: 'Signature algorithm: `SHA256withRSA` (default) or `NONEwithRSA`. With `NONEwithRSA`, the `hashCode` must already be a SHA-256 hash.'
    HashCode:
      type: string
      description: Hash of the document to sign, computed by the online service. Base64 encoded.
      examples:
      - 965e638fda4c70f667efc2d68c40c6111e5965bfc82356d
    DocDigest:
      type: string
      description: PDF document digest to sign, computed with the `Adobe.PPKLite` filter and `adbe.pkcs7.detached` subfilter. Base64 encoded.
      examples:
      - 965e638fda4c70f667efc2d68c40c6111e5965bfc82356d
    Department:
      type: string
      maxLength: 100
      description: Department that initiates the signing request.
      examples:
      - Digital Policy Office
    ServiceName:
      type: string
      maxLength: 255
      description: Online service name, shown to the user.
      examples:
      - Online Service1
    DocumentName:
      type: string
      maxLength: 255
      description: Name of the document the user is going to sign.
      examples:
      - Doc0001
    FormName:
      type: string
      maxLength: 255
      description: Form name, Unicode.
    FormNum:
      type: string
      maxLength: 20
      description: Form number, Unicode.
    FormDesc:
      type: string
      maxLength: 255
      description: Form description, Unicode.
    CallbackContentType:
      type: string
      enum:
      - application/json
      - multipart/form-data
      default: application/json
      description: Content type of the [form filling callback](/api/webhooks/form-filling-callback/). Use `multipart/form-data` if your endpoint has a request size limit; the e-bill PDF then arrives as a separate binary part.
    EMEFields:
      type: array
      items:
        type: string
        enum:
        - idNo
        - prefix
        - enName
        - chName
        - birthDate
        - gender
        - maritalStatus
        - homeTelNumber
        - officeTelNumber
        - mobileNumber
        - emailAddress
        - residentialAddress
        - postalAddress
        - educationLevel
        - addressDocInfo
        - addressDocFile
      description: '"e-ME" fields for form filling. `eMEFields` and `profileFields` cannot both be missing or empty (error `D20002`). A field present in both is shown as a profile field. See [Profile fields](/reference/profile-fields/).'
      examples:
      - - mobileNumber
        - emailAddress
        - addressDocInfo
    ProfileFields:
      type: array
      items:
        type: string
        enum:
        - idNo
        - enName
        - chName
        - birthDate
        - gender
      description: Profile fields for identity verification. `eMEFields` and `profileFields` cannot both be missing or empty (error `D20002`).
      examples:
      - - idNo
        - enName
        - gender
        - chName
        - birthDate
    TicketID:
      type: string
      maxLength: 36
      description: Identifier used to open the iAM Smart app (or the QR page) for this request.
      examples:
      - bbb8aae57c104cda40c93843ad5e6db8
    BSQCToken:
      type: string
      maxLength: 32
      description: Bulk Signing Query/Cancel token. Valid for 1 day; used to enquire status or cancel the bulk signing request.
      examples:
      - nnoadisauflanefhykdjf…f83h96e
    SigningAck:
      type: string
      enum:
      - SR001
      - SR002
      - SR003
      description: '`SR001` signature accepted · `SR002` signature rejected · `SR003` no signature received.'
    Envelope:
      type: object
      required:
      - txID
      - code
      - message
      description: Common response and callback wrapper (§2.4.2). `code` `D00000` means success; anything else is an error and `content` is empty or holds only required fields such as `businessID`.
      properties:
        txID:
          type: string
          description: Unique identifier of the message, for troubleshooting.
          examples:
          - <T=938ffb193b4b4370b6c2584372c6a588>
        code:
          type: string
          pattern: ^D\d{5}$
          description: Return code. See [Return codes](/reference/return-codes/).
          examples:
          - D00000
        message:
          type: string
          description: Status message.
          examples:
          - SUCCESS
    EncryptedBody:
      type: object
      required:
      - content
      description: 'Wire format of every POST request body after encryption (§2.3.3): the JSON business body, encrypted with AES-256-GCM using the CEK, as Base64 of `int32 ivLength (12) ‖ iv ‖ ciphertext ‖ tag`.'
      properties:
        content:
          type: string
          contentEncoding: base64
    CallbackSecretKey:
      type: string
      contentEncoding: base64
      description: 'Present on encrypted callbacks: the CEK used to encrypt `content`, encrypted with your KEK certificate''s public key and Base64 encoded. Decrypt it with your private key, then decrypt `content`.'
    CEK:
      type: object
      required:
      - secretKey
      - pubKey
      - issueAt
      - expiresIn
      properties:
        secretKey:
          type: string
          description: Symmetric content encryption key (CEK), encrypted with the KEK certificate uploaded in the Self-Service Portal, Base64 encoded.
        pubKey:
          type: string
          description: Base64-encoded public key of the certificate used to encrypt the CEK.
        issueAt:
          type: integer
          format: int64
          description: Issue time, epoch milliseconds.
        expiresIn:
          type: integer
          format: int64
          description: Key lifetime in milliseconds. May change; always compute expiry as `issueAt + expiresIn`.
    Token:
      type: object
      required:
      - accessToken
      - tokenType
      - issueAt
      - expiresIn
      - openID
      - lastModifiedDate
      - userType
      - scope
      properties:
        accessToken:
          type: string
          description: Access token. Reusable until expiry in the authentication workflow; **single use** in anonymous workflows.
        tokenType:
          type: string
          const: Bearer
        issueAt:
          type: integer
          format: int64
          description: Issue time, epoch milliseconds.
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in milliseconds; may vary by online service.
        openID:
          type: string
          description: Tokenised ID, unique per user per online service website or app.
        lastModifiedDate:
          type: integer
          format: int64
          description: Epoch milliseconds of the user's registration. Updated when verified English name, Chinese name (if verified), gender or date of birth change, or when the user re-registers after de-registration.
        userType:
          type: string
          enum:
          - default
          - sign
          description: '`default`: iAM Smart user · `sign`: iAM Smart+ user (can sign).'
        scope:
          type: string
          description: Space-delimited scopes granted to the token.
    InitiateResult:
      type: object
      required:
      - authByQR
      properties:
        authByQR:
          type: boolean
          description: '`true` if the user authenticated by scanning a QR code (different device). Always `false` for appv2 APIs.'
        ticketID:
          type: string
          description: Present when `authByQR` is `false`. Use it to open the iAM Smart app (same device). Valid for 18 minutes for signing, re-authentication, step-up and consent requests.
    AnonymousInitiateResult:
      type: object
      required:
      - ticketID
      properties:
        ticketID:
          type: string
          description: Identifies this request in the rest of the anonymous workflow (QR page or app link). Expires 12 minutes after issuance.
    IdNo:
      type: object
      description: HKIC number.
      properties:
        Identification:
          type: string
          maxLength: 8
        CheckDigit:
          type: string
          maxLength: 1
      examples:
      - Identification: A123456
        CheckDigit: A
    EnName:
      type: object
      description: English name.
      properties:
        UnstructuredName:
          type: string
          maxLength: 40
      examples:
      - UnstructuredName: SAN, Chi Nan
    ChName:
      type: object
      description: Chinese name.
      properties:
        ChineseName:
          type: string
          maxLength: 6
      examples:
      - ChineseName: 申智能
    PhoneNumber:
      type: object
      properties:
        CountryCode:
          type: string
          maxLength: 3
        SubscriberNumber:
          type: string
          maxLength: 15
      examples:
      - CountryCode: '852'
        SubscriberNumber: '98765432'
    AddressProvider:
      type: object
      description: Included when the address was retrieved from CDEG.
      properties:
        providerCode:
          type: string
          examples:
          - wsd
        lastRetrievalDate:
          type: integer
          format: int64
          description: Epoch milliseconds.
    PremisesAddress:
      type: object
      additionalProperties: true
      description: 'DPO common-schema premises address: either a Standard/Village address (Region, District, BuildingName, Estate, Street, Block, 3D address) or a Lot address (`ChiLot`/`EngLot`). See [Profile fields](/reference/profile-fields/) for sub-field lengths.'
    FreeFormatAddress:
      type: object
      properties:
        LanguageCode:
          type: string
          maxLength: 2
        AddressLine1:
          type: string
          maxLength: 250
        AddressLine2:
          type: string
          maxLength: 250
        AddressLine3:
          type: string
          maxLength: 250
    ResidentialAddress:
      type: object
      description: Exactly one of `ChiPremisesAddress`, `EngPremisesAddress` or `FreeFormatAddress`, plus `addressProvider` when retrieved from CDEG.
      properties:
        ChiPremisesAddress:
          $ref: '#/components/schemas/PremisesAddress'
        EngPremisesAddress:
          $ref: '#/components/schemas/PremisesAddress'
        FreeFormatAddress:
          $ref: '#/components/schemas/FreeFormatAddress'
        addressProvider:
          $ref: '#/components/schemas/AddressProvider'
    PostalAddress:
      type: object
      description: Exactly one of `ChiPremisesAddress`, `EngPremisesAddress`, `FreeFormatAddress` or `PostBoxAddress`, plus `addressProvider` when retrieved from CDEG.
      properties:
        ChiPremisesAddress:
          $ref: '#/components/schemas/PremisesAddress'
        EngPremisesAddress:
          $ref: '#/components/schemas/PremisesAddress'
        FreeFormatAddress:
          $ref: '#/components/schemas/FreeFormatAddress'
        PostBoxAddress:
          type: object
          description: Either `EngPostBox` or `ChiPostBox`.
          properties:
            EngPostBox:
              type: object
              properties:
                PoBoxNo:
                  type: integer
                PostOffice:
                  type: string
                PostOfficeRegion:
                  type: string
            ChiPostBox:
              type: object
              properties:
                PoBoxNo:
                  type: integer
                PostOffice:
                  type: string
                PostOfficeRegion:
                  type: string
        addressProvider:
          $ref: '#/components/schemas/AddressProvider'
    AddressDocInfo:
      type: object
      description: Data about the e-bill obtained from an address data provider (The Hong Kong and China Gas Company Limited, CLP Power Hong Kong Ltd., HK Electric or Water Supplies Department).
      properties:
        enProviderName:
          type: string
          maxLength: 255
        tcProviderName:
          type: string
          maxLength: 255
        scProviderName:
          type: string
          maxLength: 255
        enUserName:
          type: string
          maxLength: 40
          description: Unstructured name of the e-bill owner.
        tcUserName:
          type: string
          maxLength: 40
        enServiceAddress:
          type: object
          description: At most 4 lines.
          properties:
            addressLine1:
              type: string
              maxLength: 80
            addressLine2:
              type: string
              maxLength: 80
            addressLine3:
              type: string
              maxLength: 80
            addressLine4:
              type: string
              maxLength: 80
        tcServiceAddress:
          type: object
          description: At most 4 lines.
          properties:
            addressLine1:
              type: string
              maxLength: 80
            addressLine2:
              type: string
              maxLength: 80
            addressLine3:
              type: string
              maxLength: 80
            addressLine4:
              type: string
              maxLength: 80
        enPostalAddress:
          type: object
          description: At most 4 lines.
          properties:
            addressLine1:
              type: string
              maxLength: 80
            addressLine2:
              type: string
              maxLength: 80
            addressLine3:
              type: string
              maxLength: 80
            addressLine4:
              type: string
              maxLength: 80
        tcPostalAddress:
          type: object
          description: At most 4 lines.
          properties:
            addressLine1:
              type: string
              maxLength: 80
            addressLine2:
              type: string
              maxLength: 80
            addressLine3:
              type: string
              maxLength: 80
            addressLine4:
              type: string
              maxLength: 80
        lastRetrievalDate:
          type: integer
          format: int64
          description: When iAM Smart obtained the e-bill, epoch milliseconds.
    AddressDocFile:
      type: object
      description: The e-bill itself. With `multipart/form-data` callbacks, `docFile` is omitted here and sent as a separate binary part.
      properties:
        docFile:
          type: string
          contentEncoding: base64
          description: PDF e-bill, Base64 encoded.
        docHash:
          type: string
          maxLength: 64
          description: SHA-256 hash of the PDF.
        billDate:
          type: integer
          format: int64
          description: Bill date, epoch milliseconds.
    ProfileData:
      type: object
      description: Only the requested and consented fields are returned. Maximum lengths are in [Profile fields](/reference/profile-fields/).
      properties:
        idNo:
          $ref: '#/components/schemas/IdNo'
        prefix:
          type: string
          maxLength: 35
          examples:
          - Mr
        enName:
          $ref: '#/components/schemas/EnName'
        chName:
          $ref: '#/components/schemas/ChName'
        chNameVerified:
          type: string
          maxLength: 6
          description: ImmD character code points; returned when the Chinese name is verified (iAM Smart+). Use `chName` for display.
        birthDate:
          type: string
          maxLength: 8
          description: '`YYYYMMDD`; may be `19960000` or `19960100` when day or month is unknown.'
          examples:
          - '19960128'
        gender:
          type: string
          maxLength: 1
          examples:
          - M
        maritalStatus:
          type: string
          maxLength: 1
          examples:
          - S
        homeTelNumber:
          $ref: '#/components/schemas/PhoneNumber'
        officeTelNumber:
          $ref: '#/components/schemas/PhoneNumber'
        mobileNumber:
          $ref: '#/components/schemas/PhoneNumber'
        emailAddress:
          type: string
          maxLength: 128
        residentialAddress:
          $ref: '#/components/schemas/ResidentialAddress'
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
        educationLevel:
          type: string
          maxLength: 1
          examples:
          - T
        addressDocInfo:
          $ref: '#/components/schemas/AddressDocInfo'
        addressDocFile:
          $ref: '#/components/schemas/AddressDocFile'
    HashSigningResult:
      type: object
      description: '`timestamp`, `signature` and `cert` are only present when signing succeeded.'
      properties:
        hashCode:
          type: string
          description: The document hash submitted in the request.
        timestamp:
          type: integer
          format: int64
          description: Signing time, epoch milliseconds.
        signature:
          type: string
          description: Base64-encoded signature.
        cert:
          type: string
          description: Base64-encoded DER certificate of the user.
    PdfSigningResult:
      type: object
      description: '`pdfSignature` is only present when signing succeeded.'
      properties:
        docDigest:
          type: string
          description: The PDF digest submitted in the request.
        pdfSignature:
          type: string
          description: Base64-encoded PKCS#7 PDF signature (signer certificate, signed hash and signing time). Embed it into the PDF.
    BulkDocument:
      type: object
      required:
      - id
      - documentName
      description: 'One document to sign: provide `hashCode` (with optional `sigAlgo`) for a hash, or `docDigest` for a PDF.'
      properties:
        id:
          type: string
          maxLength: 36
          description: Unique document identifier, ASCII.
        documentName:
          type: string
          maxLength: 255
          description: Shown in the app when asking for consent.
        hashCode:
          $ref: '#/components/schemas/HashCode'
        sigAlgo:
          $ref: '#/components/schemas/SigAlgo'
        docDigest:
          $ref: '#/components/schemas/DocDigest'
