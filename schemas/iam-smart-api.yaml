  /api/v1/anonymous/sua/initiateRequest:
    post:
      operationId: request-anonymous-step-up-authentication
      tags:
      - Anonymous Step-up Authentication
      summary: Request Anonymous Step-up Authentication
      description: |-
        Starts step-up authentication (NFC and/or FR) **without** a prior login; only proceeds when the user's HKIC hash matches `HKICHash`. Returns a `ticketID` (valid 12 minutes) for the [QR page](/api/operations/get-qr-page/) or the app link `anon_sua` / `v2_anon_sua`. Then exchange the code and call [Obtain Anonymous Step-up Authentication Result](/api/operations/obtain-anonymous-step-up-authentication-result/).

        _Source: iAM Smart API Specification v2.5.2, section 12.5.1._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/rateLimitFactor'
      requestBody:
        required: true
        description: 'Shown **decrypted**. On the wire, send `{"content": "<encrypted>"}` — see [Encryption](/security/encryption/).'
        content:
          application/json:
            schema:
              type: object
              properties:
                businessID:
                  $ref: '#/components/schemas/BusinessID'
                HKICHash:
                  type: string
                  description: SHA-256 of the HKIC identifier (no check digit), Base64 encoded. The workflow only proceeds when the confirming user's HKIC hash matches.
                suaMethod:
                  $ref: '#/components/schemas/SuaMethod'
                suaMessage:
                  $ref: '#/components/schemas/SuaMessage'
                suaWaitPeriod:
                  $ref: '#/components/schemas/SuaWaitPeriod'
                identifierCode:
                  type: string
                  maxLength: 10
                  description: '**Required in different-device workflows.** Code you display to the user; the iAM Smart app shows it again so the user can match the request.'
              required:
              - businessID
              - HKICHash
              - suaMethod
            example:
              businessID: bbb8aae57c104cda40c93843ad5e6db8
              HKICHash: 6ea37e641260714009a880a8057032a414009a80f667efc
              suaMethod: '{"and": ["FR", "NFC"]}'
              suaMessage: '0001'
              suaWaitPeriod: 10
              identifierCode: '1234'
