        content:
          application/json:
            schema:
              type: object
              properties:
                businessID:
                  $ref: '#/components/schemas/BusinessID'
                signingResult:
                  type: string
                  enum:
                  - SR001
                  - SR002
                  - SR003
                  - ''
                  description: 'Overall result: `SR001` accepted · `SR002` rejected · `SR003` not received. Empty when acknowledging per document.'
                signatures:
                  type: array
                  description: Required when `signingResult` is empty.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 36
                      signingResult:
                        $ref: '#/components/schemas/SigningAck'
                    required:
                    - id
                    - signingResult
              required:
              - businessID
              - signingResult
            examples:
