      tags:
      - Bulk Digital Signing
      - Anonymous Bulk Digital Signing
      summary: Acknowledge Bulk Digital Signing Result
      description: |-
        Acknowledges the bulk signing result, whether it succeeded or failed. Acknowledge all documents at once with `signingResult`, or leave it empty and acknowledge per document in `signatures`.

        _Source: iAM Smart API Specification v2.5.2, section 9.5.5, 10.5.8._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
