      tags:
      - Digital Signing
      summary: Request PDF Digital Signing (appv2)
      description: |-
        appv2 variant for an online service app on the same device. Open the app with `<scheme>://v2_pdf-sign?ticketID=…`.

        The user must be an **iAM Smart+** user (`userType: sign`). FIDO verification always happens first; `suaMethod` adds NFC and/or facial recognition. Send the `rateLimitFactor` header when using step-up methods. The result arrives on the [PDF signing result callback](/api/webhooks/pdf-signing-result-callback/); then call [Acknowledge Signing Result](/api/operations/acknowledge-signing-result/). The callback may take up to 18 minutes.

        **appv2** (same device, app-to-app): Android apps are relaunched by package name + activity (no App Link needed, works without Google Mobile Services); iOS apps via Universal Link. `authByQR` is always `false`; open the app with the returned `ticketID`.

        _Source: iAM Smart API Specification v2.5.2, section 6.5.8._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/rateLimitFactor'
      requestBody:
        required: true
        description: 'Shown **decrypted**. On the wire, send `{"content": "<encrypted>"}` — see [Encryption](/security/encryption/).'
        content:
          application/json:
            schema:
              type: object
              properties:
                businessID:
                  $ref: '#/components/schemas/BusinessID'
                accessToken:
                  $ref: '#/components/schemas/AccessToken'
                openID:
                  $ref: '#/components/schemas/OpenID'
                source:
                  $ref: '#/components/schemas/AppV2Source'
                clientRedirectURI:
                  $ref: '#/components/schemas/ClientRedirectURI'
                packageName:
                  $ref: '#/components/schemas/PackageName'
                activityClass:
                  $ref: '#/components/schemas/ActivityClass'
                activityParams:
                  $ref: '#/components/schemas/ActivityParams'
                serverRedirectURI:
                  $ref: '#/components/schemas/ServerRedirectURI'
                state:
                  $ref: '#/components/schemas/State'
                docDigest:
                  $ref: '#/components/schemas/DocDigest'
                HKICHash:
                  $ref: '#/components/schemas/HKICHash'
                department:
                  $ref: '#/components/schemas/Department'
                serviceName:
                  $ref: '#/components/schemas/ServiceName'
                documentName:
                  $ref: '#/components/schemas/DocumentName'
                suaMethod:
                  $ref: '#/components/schemas/SuaMethod'
                suaWaitPeriod:
                  $ref: '#/components/schemas/SuaWaitPeriod'
              required:
              - businessID
              - accessToken
              - openID
              - source
              - serverRedirectURI
              - docDigest
              - serviceName
              - documentName
            example:
              businessID: bbb8aae57c104cda40c93843ad5e6db8
              accessToken: xxxa42e76bf4cb0846a68e6d83d6096
              openID: liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
              source: App_Package
              packageName: com.onlineservice.myapp
              activityClass: callback_activity
              activityParams: callback_param
              serverRedirectURI: https://rp_domain/rp_context/call_back_endpoint
              state: eddd527b6
              docDigest: 965e638fda4c70f667efc2d68c40c6111e5965bfc82356d
              HKICHash: 6ea37e641260714009a880a8057032a414009a80f667efc
              department: Digital Policy Office
              serviceName: Online Service1
              documentName: Doc0001
              suaMethod: '{"unary": ["FR"]}'
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    content:
                      $ref: '#/components/schemas/InitiateResult'
              examples:
                success:
                  summary: Success (decrypted)
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D00000
                    message: SUCCESS
                    content:
                      authByQR: false
                      ticketID: bbb8aae57c104cda40c93843ad5e6db8
                error:
                  summary: Error
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D20002
                    message: empty parameter {docDigest}
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: js
        label: Node.js
        source: |
          // Uses the reference client from /guides/client/ (signs, encrypts and decrypts for you)
          import { IamSmartClient } from './iam-smart-client.mjs'

          const iamSmart = new IamSmartClient({
            baseUrl: 'https://apigw-isit.staging-eid.gov.hk', // testing environment
            clientId: process.env.IAMSMART_CLIENT_ID,
            clientSecret: process.env.IAMSMART_CLIENT_SECRET,
            privateKeyPem: process.env.IAMSMART_KEK_PRIVATE_KEY,
          })

          const res = await iamSmart.post('/api/appv2/account/pdfsigning/initiateRequest', {
            businessID: "bbb8aae57c104cda40c93843ad5e6db8",
            accessToken: "xxxa42e76bf4cb0846a68e6d83d6096",
            openID: "liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D",
            source: "App_Package",
            packageName: "com.onlineservice.myapp",
            activityClass: "callback_activity",
            activityParams: "callback_param",
            serverRedirectURI: "https://rp_domain/rp_context/call_back_endpoint",
            state: "eddd527b6",
            docDigest: "965e638fda4c70f667efc2d68c40c6111e5965bfc82356d",
            HKICHash: "6ea37e641260714009a880a8057032a414009a80f667efc",
            department: "Digital Policy Office",
            serviceName: "Online Service1",
            documentName: "Doc0001",
            suaMethod: "{\"unary\": [\"FR\"]}"
          }, { rateLimitFactor: { key: 'suaMethod', value: ['FR', 'NFC'] } })
          if (res.code !== 'D00000') throw new Error(`${res.code} ${res.message}`)
          console.log(res.content) // already decrypted
      - lang: bash
        label: curl (wire format)
        source: |
          # Wire format: headers carry the HMAC signature, the body carries the AES-256-GCM ciphertext.
          curl -X POST 'https://apigw-isit.staging-eid.gov.hk/api/appv2/account/pdfsigning/initiateRequest' \
            -H 'Content-Type: application/json' \
            -H "clientID: $CLIENT_ID" \
            -H 'signatureMethod: HmacSHA256' \
            -H "timestamp: $TIMESTAMP" \
            -H "nonce: $NONCE" \
            -H "signature: $SIGNATURE" \
            -H "rateLimitFactor: $RATE_LIMIT_FACTOR_BASE64" \
            -d "{\"content\":\"$ENCRYPTED_BODY\"}"
