# iAM Smart API — OpenAPI 3.1 description
# Transcribed from the iAM Smart API Specification v2.5.2 (February 2026).
# The PDF specification is authoritative; see /reference/errata/ for inconsistencies found while transcribing.
openapi: 3.1.0
info:
  title: iAM Smart API
  version: 2.5.2
  summary: Hong Kong Government's iAM Smart digital identity APIs for online services.
  description: |-
    Interactive reference generated from the **iAM Smart API Specification v2.5.2 (February 2026)**, published by Cyberport for the Government of the HKSAR.

    Read this before calling any endpoint:

    1. **Every POST is signed** with HMAC-SHA256 using your client secret — see the five header parameters on each operation and [Request signing](/security/signing/).
    2. **Every POST body is encrypted** with AES-256-GCM using a content encryption key (CEK) from [Request CEK](/api/operations/request-cek/). Request and response bodies in this reference are shown **decrypted**; on the wire they are `{"content": "<Base64>"}`. See [Encryption](/security/encryption/).
    3. **Business errors return HTTP 200** with a non-`D00000` `code`. See [Return codes](/reference/return-codes/).

    Every operation and callback page has a **Try it** console at the top that signs, encrypts and sends the request from your browser and decrypts the response — against the testing gateway or the [local mock](/guides/mock-server/). See also the [developer tools](/tools/) and, for server code, the [reference client](/guides/client/).

    This is an unofficial rendering for developer convenience. The PDF specification remains authoritative.
  contact:
    name: iAM Smart support (Cyberport)
    email: iamsmart@cyberport.hk
    url: https://iamsmart.cyberport.hk/
externalDocs:
  description: Original PDF specification
  url: https://iamsmart.cyberport.hk/wp-content/uploads/iAM_Smart_API_Specification_v2.5.2.pdf
servers:
- url: https://apigw-isit.staging-eid.gov.hk
  description: Testing environment (iAM Smart app URL scheme `hk.gov.iamsmart.testapp://`)
- url: https://apigw.iamsmart.gov.hk
  description: Production environment (iAM Smart app URL scheme `hk.gov.iamsmart://`)
tags:
- name: Encryption Key
  description: Obtain and revoke the content encryption key (CEK). Read [Encryption](/security/encryption/) first.
- name: Authentication
  description: 'Log users in with iAM Smart. Guide: [Authentication](/guides/authentication/).'
- name: Profiles
  description: 'Profile and e-ME data right after login, without an authorisation page (GRO only). Guide: [Profiles](/guides/profiles/).'
- name: Form Filling
  description: 'Profile and e-ME data with user consent, after login. Guide: [Form Filling](/guides/form-filling/).'
- name: Anonymous Form Filling
  description: 'Form filling without service login. Guide: [Anonymous Form Filling](/guides/anonymous-form-filling/).'
- name: Digital Signing
  description: 'Sign a hash or PDF with iAM Smart+, after login. Guide: [Digital Signing](/guides/digital-signing/).'
- name: Anonymous Digital Signing
  description: 'Signing without service login. Guide: [Anonymous Digital Signing](/guides/anonymous-digital-signing/).'
- name: Re-authentication
  description: 'Ask a logged-in user to confirm their identity again. Guide: [Re-authentication](/guides/re-authentication/).'
- name: Bulk Digital Signing
  description: 'Sign up to 1000 documents in one consent, after login. Guide: [Bulk Digital Signing](/guides/bulk-digital-signing/).'
- name: Anonymous Bulk Digital Signing
  description: 'Bulk signing without service login. Guide: [Anonymous Bulk Digital Signing](/guides/anonymous-bulk-digital-signing/).'
- name: Step-up Authentication
  description: 'Re-verify a logged-in user with NFC and/or facial recognition. Guide: [Step-up Authentication](/guides/step-up-authentication/).'
- name: Anonymous Step-up Authentication
  description: 'Step-up authentication without service login. Guide: [Anonymous Step-up Authentication](/guides/anonymous-step-up-authentication/).'
- name: CDEG Integration
  description: 'Query and request consent for Consented Data Exchange Gateway providers. Guide: [CDEG Integration](/guides/cdeg/).'
- name: Callbacks
  description: Requests iAM Smart sends to your endpoints.
- name: Deprecated APIs
  description: APIs shut down on 31 December 2025. See [Deprecations](/reference/deprecations/).
paths:
  /api/v1/security/getKey:
    post:
      operationId: request-cek
      tags:
      - Encryption Key
      summary: Request Symmetric Content Encryption Key
      description: |-
        Requests the AES-256 content encryption key (CEK) used to encrypt every other POST body and to decrypt responses and callbacks. The CEK comes back encrypted with your KEK certificate (uploaded in the Self-Service Portal); decrypt `secretKey` with your private key.

        This is the only POST request that is **not encrypted**. Cache the CEK until `issueAt + expiresIn` — calling this too often can return HTTP 429.

        _Source: iAM Smart API Specification v2.5.2, section 2.3.6.1._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    content:
                      $ref: '#/components/schemas/CEK'
              examples:
                success:
                  summary: Success (decrypted)
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D00000
                    message: SUCCESS
                    content:
                      secretKey: X2WnRD+LhN5GZp5n1CKLqKr2pmoMtZHg…VrOxlFzmw==
                      pubKey: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA…QIDAQAB
                      issueAt: 1557053922938
                      expiresIn: 86400000
                error:
                  summary: Error
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D20006
                    message: signature verification failed
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: js
        label: Node.js
        source: |
          // Uses the reference client from /guides/client/ (signs, encrypts and decrypts for you)
          import { IamSmartClient } from './iam-smart-client.mjs'

          const iamSmart = new IamSmartClient({
            baseUrl: 'https://apigw-isit.staging-eid.gov.hk', // testing environment
            clientId: process.env.IAMSMART_CLIENT_ID,
            clientSecret: process.env.IAMSMART_CLIENT_SECRET,
            privateKeyPem: process.env.IAMSMART_KEK_PRIVATE_KEY,
          })

          const res = await iamSmart.post('/api/v1/security/getKey', {})
          if (res.code !== 'D00000') throw new Error(`${res.code} ${res.message}`)
          console.log(res.content) // already decrypted
      - lang: bash
        label: curl (wire format)
        source: |
          # Wire format: headers carry the HMAC signature, the body carries the AES-256-GCM ciphertext.
          curl -X POST 'https://apigw-isit.staging-eid.gov.hk/api/v1/security/getKey' \
            -H 'Content-Type: application/json' \
            -H "clientID: $CLIENT_ID" \
            -H 'signatureMethod: HmacSHA256' \
            -H "timestamp: $TIMESTAMP" \
            -H "nonce: $NONCE" \
            -H "signature: $SIGNATURE" \
            -d ''
  /api/v1/security/revokeKey:
    post:
      operationId: revoke-cek
      tags:
      - Encryption Key
      summary: Revoke Symmetric Content Encryption Key
      description: |-
        Revokes the current CEK. Use it with *Request CEK* to switch to a newly configured KEK before the old CEK expires (§2.3.2). Not encrypted.

        _Source: iAM Smart API Specification v2.5.2, section 2.3.6.2._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                success:
                  summary: Success (decrypted)
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D00000
                    message: SUCCESS
                error:
                  summary: Error
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D20006
                    message: signature verification failed
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: js
        label: Node.js
        source: |
          // Uses the reference client from /guides/client/ (signs, encrypts and decrypts for you)
          import { IamSmartClient } from './iam-smart-client.mjs'

          const iamSmart = new IamSmartClient({
            baseUrl: 'https://apigw-isit.staging-eid.gov.hk', // testing environment
            clientId: process.env.IAMSMART_CLIENT_ID,
            clientSecret: process.env.IAMSMART_CLIENT_SECRET,
            privateKeyPem: process.env.IAMSMART_KEK_PRIVATE_KEY,
          })

          const res = await iamSmart.post('/api/v1/security/revokeKey', {})
          if (res.code !== 'D00000') throw new Error(`${res.code} ${res.message}`)
          console.log(res.content) // already decrypted
      - lang: bash
        label: curl (wire format)
        source: |
          # Wire format: headers carry the HMAC signature, the body carries the AES-256-GCM ciphertext.
          curl -X POST 'https://apigw-isit.staging-eid.gov.hk/api/v1/security/revokeKey' \
            -H 'Content-Type: application/json' \
            -H "clientID: $CLIENT_ID" \
            -H 'signatureMethod: HmacSHA256' \
            -H "timestamp: $TIMESTAMP" \
            -H "nonce: $NONCE" \
            -H "signature: $SIGNATURE" \
            -d ''
  /api/v1/auth/getQR:
    get:
      operationId: get-qr-page
      tags:
      - Authentication
      - Anonymous Form Filling
      - Anonymous Digital Signing
      - Anonymous Bulk Digital Signing
      - Anonymous Step-up Authentication
      summary: Request QR Page
      description: |-
        Browser redirect (not a server-to-server call): send the user's browser here to show the QR / app broker page. After the user approves in the iAM Smart app, the browser is redirected to `redirectURI` with `code` and `state` ([callback](/api/webhooks/auth-code-callback/)); if the user denies, only `state` (and `error_code`) is returned.

        Used for login (`eidapi_auth`) and for the anonymous workflows, which also pass `ticketID`. Build one interactively with the [getQR URL builder](/tools/#getqr-url-builder).

        _Source: iAM Smart API Specification v2.5.2, section 3.4.1, 5.5.2, 7.5.3, 10.5.2, 12.5.2._
      parameters:
      - name: clientID
        in: query
        required: true
        schema:
          type: string
        description: Client ID assigned at registration (see the Self-Service Portal).
      - name: responseType
        in: query
        required: true
        schema:
          type: string
          const: code
        description: Must be `code`.
      - name: source
        in: query
        required: true
        schema:
          type: string
          enum:
          - Android_Chrome
          - Android_Firefox
          - Android_Edge
          - Android_Samsung
          - Android_Huawei
          - Android_Xiaomi
          - Android_IMS_InAppBrowser
          - iOS_Safari
          - iOS_Chrome
          - iOS_Firefox
          - iOS_Edge
          - iOS_IMS_InAppBrowser
          - PC_Browser
        description: Browser of the user. `App_Link`/`App_Scheme` are not accepted here. See [Source values](/reference/source-values/).
      - name: redirectURI
        in: query
        required: true
        schema:
          type: string
        description: URL-encoded callback URI registered in the Self-Service Portal.
      - name: scope
        in: query
        required: true
        schema:
          type: string
        description: 'URL-encoded, space-delimited, case-sensitive scopes: `eidapi_auth`, `eidapi_profiles`, `eidapi_formFilling`, `eidapi_sign`, `eidapi_fr`, `eidapi_bulksign`, `eidapi_sua`.'
        example: eidapi_auth eidapi_formFilling eidapi_profiles
      - name: ticketID
        in: query
        required: false
        schema:
          type: string
        description: '**Required in anonymous workflows** (form filling, signing, bulk signing, step-up): the `ticketID` from the anonymous initiate request.'
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum:
          - en-US
          - zh-HK
          - zh-CN
          default: zh-HK
        description: Display language. Defaults to `zh-HK`.
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/State'
        description: Anti-CSRF value defined by the online service. If present, the same value is returned in the callback. Secure random string, at most 36 characters (UUID length); only ASCII letters, numbers, underscore and hyphen are accepted.
      - name: brokerPage
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When `true`, Universal Link (iOS) / App Link (Android) is used to open the iAM Smart app, falling back to the QR page without detecting whether the app is installed. Useful for mobile web.
      responses:
        '302':
          description: Redirect to the iAM Smart QR / app broker page. No response body.
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: bash
        label: Example URL
        source: |
          # Line breaks for legibility only
          https://apigw-isit.staging-eid.gov.hk/api/v1/auth/getQR
            ?clientID=Online%20Service1
            &responseType=code
            &source=Android_Chrome
            &redirectURI=https%3A%2F%2Frp_domain%2Frp_context%2Fcall_back_endpoint
            &scope=eidapi_auth%20eidapi_formFilling%20eidapi_profiles
            &lang=en-US
            &state=eb9b7b8eddd5
  /api/v1/auth/getToken:
    post:
      operationId: request-access-token
      tags:
      - Authentication
      - Anonymous Form Filling
      - Anonymous Digital Signing
      - Anonymous Bulk Digital Signing
      - Anonymous Step-up Authentication
      summary: Request accessToken & Tokenised ID
      description: |-
        Exchanges an authorisation `code` for an `accessToken` and the user's tokenised ID (`openID`).

        - The `code` is single use. It expires after **60 seconds** (login), **1 minute** (anonymous workflows) or **30 seconds** (Direct Login v2).
        - In **anonymous** workflows the returned `accessToken` can be used **once**.
        - For **Direct Login v2**, receive the code on a separate callback endpoint and send `isDirectLoginV2: "true"`; for Direct Login v2 (App) also send the PKCE `code_verifier` passed to your app.

        _Source: iAM Smart API Specification v2.5.2, section 3.4.5, 5.5.6, 7.5.7, 10.5.5, 12.5.6._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      requestBody:
        required: true
        description: 'Shown **decrypted**. On the wire, send `{"content": "<encrypted>"}` — see [Encryption](/security/encryption/).'
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorisation code from the callback. Single use.
                code_verifier:
                  type: string
                  description: '**Direct Login v2 (App) only.** PKCE code verifier received by your app together with the code.'
                isDirectLoginV2:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  default: 'false'
                  description: Set to `"true"` when the code was received on your Direct Login v2 callback endpoint. Omit or `"false"` otherwise.
                grantType:
                  type: string
                  const: authorization_code
              required:
              - code
              - grantType
            examples:
              login:
                summary: Login or anonymous workflow
                value:
                  code: xxxa42e76bf4cb0846a68e6d83d6096
                  grantType: authorization_code
              directLoginV2:
                summary: Direct Login v2
                value:
                  code: xxxa42e76bf4cb0846a68e6d83d6096
                  isDirectLoginV2: 'true'
                  grantType: authorization_code
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    content:
                      $ref: '#/components/schemas/Token'
              examples:
                success:
                  summary: Success (decrypted)
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D00000
                    message: SUCCESS
                    content:
                      accessToken: 0ad186353c424c64897fcc00445c9ba1
                      tokenType: Bearer
                      issueAt: 1557053922938
                      expiresIn: 14400000
                      openID: liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
                      lastModifiedDate: 1560849218006
                      userType: sign
                      scope: eidapi_auth eidapi_formFilling
                error:
                  summary: Error
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D40004
                    message: authCode not exist or expired
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: js
        label: Node.js
        source: |
          // Uses the reference client from /guides/client/ (signs, encrypts and decrypts for you)
          import { IamSmartClient } from './iam-smart-client.mjs'

          const iamSmart = new IamSmartClient({
            baseUrl: 'https://apigw-isit.staging-eid.gov.hk', // testing environment
            clientId: process.env.IAMSMART_CLIENT_ID,
            clientSecret: process.env.IAMSMART_CLIENT_SECRET,
            privateKeyPem: process.env.IAMSMART_KEK_PRIVATE_KEY,
          })

          const res = await iamSmart.post('/api/v1/auth/getToken', {
            code: "xxxa42e76bf4cb0846a68e6d83d6096",
            grantType: "authorization_code"
          })
          if (res.code !== 'D00000') throw new Error(`${res.code} ${res.message}`)
          console.log(res.content) // already decrypted
      - lang: bash
        label: curl (wire format)
        source: |
          # Wire format: headers carry the HMAC signature, the body carries the AES-256-GCM ciphertext.
          curl -X POST 'https://apigw-isit.staging-eid.gov.hk/api/v1/auth/getToken' \
            -H 'Content-Type: application/json' \
            -H "clientID: $CLIENT_ID" \
            -H 'signatureMethod: HmacSHA256' \
            -H "timestamp: $TIMESTAMP" \
            -H "nonce: $NONCE" \
            -H "signature: $SIGNATURE" \
            -d "{\"content\":\"$ENCRYPTED_BODY\"}"
  /api/v1/ccic/verifyIsCcic:
    post:
      operationId: verify-ccic-user
      tags:
      - Authentication
      summary: Verify CCIC User
      description: |-
        Checks whether the authenticated user holds a Consular Corps Identity Card (CCIC). Ask the iAM Smart support team to grant access before use.

        _Source: iAM Smart API Specification v2.5.2, section 3.4.7._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      requestBody:
        required: true
        description: 'Shown **decrypted**. On the wire, send `{"content": "<encrypted>"}` — see [Encryption](/security/encryption/).'
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  $ref: '#/components/schemas/AccessToken'
                openID:
                  $ref: '#/components/schemas/OpenID'
              required:
              - accessToken
              - openID
            example:
              accessToken: xxxa42e76bf4cb0846a68e6d83d6096
              openID: liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    content:
                      type: object
                      properties:
                        verifyResult:
                          type: boolean
                          description: '`true` if the user is a CCIC holder.'
                      required:
                      - verifyResult
              examples:
                success:
                  summary: Success (decrypted)
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D00000
                    message: SUCCESS
                    content:
                      verifyResult: true
                error:
                  summary: Error
                  value:
                    txID: <T=938ffb193b4b4370b6c2584372c6a588>
                    code: D20002
                    message: empty parameter {accessToken}
        default:
          $ref: '#/components/responses/HttpError'
      x-codeSamples:
      - lang: js
        label: Node.js
        source: |
          // Uses the reference client from /guides/client/ (signs, encrypts and decrypts for you)
          import { IamSmartClient } from './iam-smart-client.mjs'

          const iamSmart = new IamSmartClient({
            baseUrl: 'https://apigw-isit.staging-eid.gov.hk', // testing environment
            clientId: process.env.IAMSMART_CLIENT_ID,
            clientSecret: process.env.IAMSMART_CLIENT_SECRET,
            privateKeyPem: process.env.IAMSMART_KEK_PRIVATE_KEY,
          })

          const res = await iamSmart.post('/api/v1/ccic/verifyIsCcic', {
            accessToken: "xxxa42e76bf4cb0846a68e6d83d6096",
            openID: "liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D"
          })
          if (res.code !== 'D00000') throw new Error(`${res.code} ${res.message}`)
          console.log(res.content) // already decrypted
      - lang: bash
        label: curl (wire format)
        source: |
          # Wire format: headers carry the HMAC signature, the body carries the AES-256-GCM ciphertext.
          curl -X POST 'https://apigw-isit.staging-eid.gov.hk/api/v1/ccic/verifyIsCcic' \
            -H 'Content-Type: application/json' \
            -H "clientID: $CLIENT_ID" \
            -H 'signatureMethod: HmacSHA256' \
            -H "timestamp: $TIMESTAMP" \
            -H "nonce: $NONCE" \
            -H "signature: $SIGNATURE" \
            -d "{\"content\":\"$ENCRYPTED_BODY\"}"
  /api/v1/auth/account/getLastLoginStatus:
    post:
      operationId: get-last-login-status
      tags:
      - Authentication
      summary: Get Last Login Status
      description: |-
        Returns how the user unlocked the iAM Smart app the last time they logged in: PIN or biometrics.

        _Source: iAM Smart API Specification v2.5.2, section 3.4.10._
      parameters:
      - $ref: '#/components/parameters/clientID'
      - $ref: '#/components/parameters/signatureMethod'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/nonce'
      - $ref: '#/components/parameters/signature'
      requestBody:
        required: true
        description: 'Shown **decrypted**. On the wire, send `{"content": "<encrypted>"}` — see [Encryption](/security/encryption/).'
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  $ref: '#/components/schemas/AccessToken'
                openID:
                  $ref: '#/components/schemas/OpenID'
              required:
              - accessToken
              - openID
            example:
              accessToken: xxxa42e76bf4cb0846a68e6d83d6096
              openID: liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
      responses:
        '200':
          description: HTTP 200 is returned for both success and business errors. Check `code`; `content` is encrypted on the wire and shown decrypted here.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    content:
                      type: object
                      properties:
                        loginType:
                          type: string
                          enum:
                          - PIN
                          - BIO
                          description: '`PIN` for PIN code, `BIO` for biometrics.'
                      required:
                      - loginType
              examples:
                success:
