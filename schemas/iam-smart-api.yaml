  /api/appv2/bdss/account/initiateRequest:
    post:
      operationId: request-bulk-digital-signing-appv2
      tags:
      - Bulk Digital Signing
      summary: Request Bulk Digital Signing (appv2)
      description: |-
        Asks an iAM Smart+ user to sign up to 1000 hashes / PDF digests in one consent. Send JSON, or `multipart/form-data` with `reqFile` (documents) and `reqMetadata` (the rest). You first receive a [BSQC token](/api/webhooks/bsqc-token-callback/) (within 18 minutes), then the [signing result](/api/webhooks/bulk-signing-result-callback/) (within 1 day), which you must [acknowledge](/api/operations/acknowledge-bulk-signing-result/). Same-device app: `<scheme>://v2_bulk-sign?ticketID=…`.

        **appv2** (same device, app-to-app): Android apps are relaunched by package name + activity (no App Link needed, works without Google Mobile Services); iOS apps via Universal Link. `authByQR` is always `false`; open the app with the returned `ticketID`.

        _Source: iAM Smart API Specification v2.5.2, section 9.5.8._
