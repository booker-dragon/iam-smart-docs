                summary: Acknowledge all documents
                value:
                  businessID: bbb8aae57c104cda40c93843ad5e6db8
                  signingResult: SR001
              perDocument:
                summary: Acknowledge per document
                value:
                  businessID: bbb8aae57c104cda40c93843ad5e6db8
                  signingResult: ''
                  signatures:
                  - id: egh…cva
                    signingResult: SR001
                  - id: hrf…bnd
                    signingResult: SR002
