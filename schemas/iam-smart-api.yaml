            schema:
              type: object
              properties:
                businessID:
                  $ref: '#/components/schemas/BusinessID'
                accessToken:
                  $ref: '#/components/schemas/AccessToken'
                openID:
                  $ref: '#/components/schemas/OpenID'
                source:
                  $ref: '#/components/schemas/AppV2Source'
                clientRedirectURI:
                  $ref: '#/components/schemas/ClientRedirectURI'
                packageName:
                  $ref: '#/components/schemas/PackageName'
                activityClass:
                  $ref: '#/components/schemas/ActivityClass'
                activityParams:
                  $ref: '#/components/schemas/ActivityParams'
                serverRedirectURI:
                  type: string
                  format: uri
                  description: Endpoint that receives the [BSQC token callback](/api/webhooks/bsqc-token-callback/).
                callbackResultURI:
                  type: string
                  format: uri
                  description: Endpoint that receives the [bulk signing result callback](/api/webhooks/bulk-signing-result-callback/).
                state:
                  $ref: '#/components/schemas/State'
                HKICHash:
                  $ref: '#/components/schemas/HKICHash'
                department:
                  type: string
                  maxLength: 100
                  description: Department shown on the consent page.
                serviceName:
                  type: string
                  maxLength: 255
                  description: Service name shown on the consent page.
                requestName:
                  type: string
                  maxLength: 255
                  description: Bulk signing request name shown on the consent page.
                maxCallbackSigs:
                  type: integer
                  default: 1000
                  description: Maximum signatures your endpoint accepts in one result callback. Results are split across `int((n-1)/m + 1)` callbacks.
                documents:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/BulkDocument'
                  description: 1 to 1000 documents (hashes and/or PDF digests).
              required:
              - businessID
              - accessToken
              - openID
              - source
              - serverRedirectURI
              - callbackResultURI
              - serviceName
              - requestName
              - documents
            example:
              businessID: bbb8aae57c104cda40c93843ad5e6db8
              accessToken: xxxa42e76bf4cb0846a68e6d83d6096
              openID: liR14%2BvX%2F5hSum5uf4ERczu0KcDnIJA5BM7FoM1ag9c%3D
              source: App_Package
              packageName: com.onlineservice.myapp
              activityClass: callback_activity
              activityParams: callback_param
              serverRedirectURI: https://rp_domain/rp_context/call_back_endpoint
              state: eddd527b6
              callbackResultURI: https://rp_domain/rp_context/endpoint
              HKICHash: 6ea37e641260714009a880a8057032a414009a80f667efc
              department: Digital Policy Office
              serviceName: Online Service 1
              requestName: Bulk Digital Signing for Contracts
              maxCallbackSigs: 200
              documents:
              - id: aef…cth
                documentName: Document
                hashCode: 965e…356d
